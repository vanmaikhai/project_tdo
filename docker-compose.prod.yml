version: '3.9'

networks:
  tdo-network:
    driver: bridge

services:
  node:
    image: ${DOCKER_REGISTRY}/${APP_NAME}-backend:${BUILD_NUMBER:-latest}
    container_name: node-container
    ports:
      - '9999:9999'
    networks:
      - tdo-network
    environment:
      - NODE_ENV=production
      - BUILD_NUMBER=${BUILD_NUMBER}
      - GIT_COMMIT=${GIT_COMMIT}
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.3'
    healthcheck:
      test: ["CMD", "node", "healthcheck.js"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  react:
    image: ${DOCKER_REGISTRY}/${APP_NAME}-frontend:${BUILD_NUMBER:-latest}
    container_name: react-container
    ports:
      - '3000:3000'
    networks:
      - tdo-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.2'
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  mysql:
    container_name: mysql_tdo
    image: mysql:8.0
    ports:
      - '3398:3306'
    env_file: .env
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - tdo-network
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password --innodb-buffer-pool-size=128M
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  nginx:
    container_name: nginx-tdo
    build:
      context: ./nginx
      dockerfile: Dockerfile
    ports:
      - '8088:80'
    depends_on:
      - node
      - react
    networks:
      - tdo-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.1'
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:7-alpine
    container_name: redis-tdo
    networks:
      - tdo-network
    restart: unless-stopped
    command: redis-server --maxmemory 64mb --maxmemory-policy allkeys-lru
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.1'

volumes:
  mysql_data:
