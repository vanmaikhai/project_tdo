name: Docker Security Scan

on:
  push:
    branches: [ main, master ]
    paths:
      - 'tdo-be/Dockerfile'
      - 'tdo-fe/Dockerfile'
      - 'tdo-be/package*.json'
      - 'tdo-fe/package*.json'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'tdo-be/Dockerfile'
      - 'tdo-fe/Dockerfile'

jobs:
  docker-build-and-scan:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        service: [
          { name: 'backend', path: 'tdo-be', dockerfile: 'tdo-be/Dockerfile' },
          { name: 'frontend', path: 'tdo-fe', dockerfile: 'tdo-fe/Dockerfile' }
        ]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Build Docker image
      uses: docker/build-push-action@v6
      with:
        context: ${{ matrix.service.path }}
        file: ${{ matrix.service.dockerfile }}
        target: production
        tags: tdo-${{ matrix.service.name }}:latest
        load: true
        cache-from: type=gha
        cache-to: type=gha,mode=max
    
    - name: Run Trivy vulnerability scanner on image
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: 'tdo-${{ matrix.service.name }}:latest'
        format: 'sarif'
        output: '${{ matrix.service.name }}-image-scan.sarif'
    
    - name: Upload Trivy scan results
      uses: github/codeql-action/upload-sarif@v4
      if: always()
      with:
        sarif_file: '${{ matrix.service.name }}-image-scan.sarif'
    
    - name: Run Snyk to check Docker image for vulnerabilities
      uses: snyk/actions/docker@master
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      with:
        image: 'tdo-${{ matrix.service.name }}:latest'
        args: --severity-threshold=high --file=${{ matrix.service.dockerfile }}
      continue-on-error: true
    
    - name: Upload Snyk results to GitHub Code Scanning
      uses: github/codeql-action/upload-sarif@v4
      if: always()
      with:
        sarif_file: snyk.sarif
